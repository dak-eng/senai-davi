<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca CEP</title>

    <style>
        body{
            background-image:
            linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
             url("img/fundo.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;

        }
        
        
        .container{
        display: flex;
        justify-content: center;
        align-items: center;
    }
        
        .card-custom{
            width: 100%;
            max-width: 600px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .card-header{
            background: linear-gradient(90deg, #2563eb, #06b6d4);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .btn-custom{
            background: linear-gradient(90deg, #2563eb, #06b6d4);
            border: none;
            transition: 0.3s;
        }

        .btn-custom:hover{
            transform: scale(1.02);
            opacity: 0.9;
        }

        #myDiv{
            animation: fade 0.5s ease;
        }

        @keyframes fade{
            from{
                opacity: 0;
                transform: translateY(10px);
            }

            to{
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card card-custom">

        <div class="card-header">
           
            <h2> Busca de CEP</h2>
         
        </div>

        <div class="card-body p-4">

           
            <form>

             
                <div class="mb-3">
                    <label class="form-label">CEP</label>
                    <input 
                        type="text" 
                        class="form-control form-control-lg"
                        id="myInput"
                        placeholder="Digite o CEP">
                </div>

               
                <div class="mb-3">
                    <label class="form-label">Tipo de Busca</label>
                    <select class="form-select">
                        <option>Busca rápida</option>
                        <option>Busca completa</option>
                    </select>
                </div>

               
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="salvar">
                    <label class="form-check-label" for="salvar">
                        Salvar histórico
                    </label>
                </div>

               
                <div class="mb-3">
                    <label class="form-label">Formato</label>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="modo" checked>
                        <label class="form-check-label">
                            Compacto
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="modo">
                        <label class="form-check-label">
                            Detalhado
                        </label>
                    </div>
                </div>

              
                <button 
                    type="button"
                    onclick="mf()"
                    class="btn btn-custom text-white w-100 btn-lg">
                    Buscar CEP
                </button>

            </form>

            
            <div id="myDiv" class="mt-4"></div>

        </div>
    </div>
</div>

<script>

function mf() {

    let input = document.getElementById("myInput");
    let div = document.getElementById("myDiv");

    const cep = input.value;

    fetch(`https://viacep.com.br/ws/${cep}/json/`)
    .then(response => response.json())

    .then(data => {

        div.innerHTML = `
        
        <div class="alert alert-success">

            <h5 class="mb-3">Resultado Encontrado</h5>

            <ul class="list-group">

                <li class="list-group-item">
                    <strong>CEP:</strong> ${data.cep}
                </li>

                <li class="list-group-item">
                    <strong>Logradouro:</strong> ${data.logradouro}
                </li>

                <li class="list-group-item">
                    <strong>Bairro:</strong> ${data.bairro}
                </li>

                <li class="list-group-item">
                    <strong>Cidade:</strong> ${data.localidade}
                </li>

                <li class="list-group-item">
                    <strong>Estado:</strong> ${data.uf}
                </li>

            </ul>

        </div>

        `;
    })

    .catch(error => {

        div.innerHTML = `
        
        <div class="alert alert-danger">
            Erro ao buscar o CEP.
        </div>
        
        `;

        console.error("Erro:", error);
    });
}

</script>

</body>
</html>
