
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca CEP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-image:
            linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
             url("img/fundo.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: auto; 
            padding: 20px;
        }
    
        .card-custom {
            background: rgb(255, 255, 255);
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding-bottom: 20px;
        }

        .card-header{
            background: linear-gradient(90deg, #000000, #000000ad);
            color: rgb(255, 255, 255);
            text-align: center;
            padding: 20px;
        }

        .btn-custom{
            background: linear-gradient(90deg, #000000, #000000ad);
            border: none;
            transition: 0.3s;
        }

        .btn-custom:hover{
            transform: scale(1.02);
            opacity: 0.9;
        }

        #myDiv{
            animation: fade 0.5s ease;
        }

        @keyframes fade{
            from{
                opacity: 0;
                transform: translateY(10px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card card-custom">
        <div class="card-header">
            <h2 class="m-0">Busca de CEP</h2>
        </div>

        <div class="card-body p-4">
            <form>
                <div class="mb-3">
                    <label class="form-label">CEP</label>
                    <input 
                        type="text" 
                        class="form-control form-control-lg"
                        id="myInput"
                        placeholder="Digite o CEP">
                </div>
                
                <button 
                    type="button"
                    onclick="mf()"
                    class="btn btn-custom text-white w-100 btn-lg">
                    Buscar CEP
                </button>
            </form>

            <div id="myDiv" class="mt-4"></div>
        </div>
    </div>
</div>

<script>
function mf() {
    let input = document.getElementById("myInput");
    let div = document.getElementById("myDiv");
    const cep = input.value;

    fetch(`https://viacep.com.br/ws/${cep}/json/`)
    .then(response => response.json())
    .then(data => {
        if(data.erro) {
            throw new Error("CEP não encontrado");
        }
        div.innerHTML = `
        <div class="alert alert-success">
            <h5 class="mb-3">Resultado Encontrado</h5>
            <ul class="list-group text-dark">
                <li class="list-group-item"><strong>CEP:</strong> ${data.cep}</li>
                <li class="list-group-item"><strong>Logradouro:</strong> ${data.logradouro || 'N/A'}</li>
                <li class="list-group-item"><strong>Bairro:</strong> ${data.bairro || 'N/A'}</li>
                <li class="list-group-item"><strong>Cidade:</strong> ${data.localidade}</li>
                <li class="list-group-item"><strong>Estado:</strong> ${data.uf}</li>
            </ul>
        </div>`;
    })
    .catch(error => {
        div.innerHTML = `
        <div class="alert alert-danger">
            Erro ao buscar o CEP. Verifique o número digitado.
        </div>`;
        console.error("Erro:", error);
    });
}
</script>

</body>
</html>
