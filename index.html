<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória — Pokémon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🧠 Jogo da Memória<br>de Pokémons</h1>
    <p>Descubra se você tem o olhar de um mestre Pokémon!</p>
  </header>

  <div class="placar">
    <div class="stat">
      <div class="stat-valor" id="tentativas">0</div>
      <div class="stat-label">Tentativas</div>
    </div>

    <div class="stat">
      <div class="stat-valor" id="acertos">0</div>
      <div class="stat-label">Acertos</div>
    </div>

    <div class="stat">
      <div class="stat-valor" id="tempo">--</div>
      <div class="stat-label">Tempo</div>
    </div>
  </div>

  <div class="progresso-wrap">
    <div class="progresso-barra" id="progresso"></div>
  </div>

  <!-- ============================================================
       CONTROLES DO JOGO
       ============================================================ -->
  <div class="controles">
    <select id="nivel">
      <option value="facil">Fácil — 8 pares</option>
      <option value="medio">Médio — 16 pares</option>
      <option value="dificil">Difícil — 32 pares</option>
    </select>

    <button id="btn-iniciar" onclick="iniciarPartida()">▶ Iniciar Jogo</button>
    <button id="btn-reiniciar" onclick="iniciarPartida()">↺ Novo Jogo</button>
  </div>

  <div class="grade" id="grade" role="list"></div>

  <div class="vitoria" id="vitoria">
    <div class="vitoria-emoji">🏆</div>
    <h2>Parabéns!</h2>
    <p id="msg-vitoria">Você completou o jogo!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
